[tool.poetry]
name = "kursovaj-2"
version = "0.1.0"
description = ""
authors = ["Ivan Glushenkov <glushman966@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.14"
pytest = "^9.0.2"
requests = "^2.32.5"
flake8 = "^7.3.0"
black = "^26.1.0"
isort = "^7.0.0"
mypy = "^1.19.1"
tzdata = "^2025.3"
pycountry = "^24.6.1"
pytest-cov = "^7.0.0"
types-requests = "^2.32.4.20260107"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line_length = 119
exclude = ".git"

[tool.isort]
line_length = 119
force_single_line = true

[tool.mypy]
disallow_untyped_defs=true
warn_return_any=true
exclude = "venv"

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true
